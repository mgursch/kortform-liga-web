name: Deploy to GitHub Pages

# Plain static site: site/ is published as is, there is no build step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a running deployment, so a publish never ends up half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The app links break silently when these files are missing or malformed.
      - name: Check well-known files
        run: |
          test -f site/.nojekyll
          test -f site/CNAME
          python3 -m json.tool site/.well-known/assetlinks.json > /dev/null
          python3 -m json.tool site/.well-known/apple-app-site-association > /dev/null

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # include-hidden-files is required: upload-pages-artifact excludes dot files by default,
      # which would drop site/.well-known/ and site/.nojekyll.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
